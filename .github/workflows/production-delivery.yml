name: Production delivery

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-openbmb
  cancel-in-progress: false

env:
  DEPLOY_HOST: 124.220.81.104
  DEPLOY_USER: ubuntu
  SOURCE_SHA: ${{ github.sha }}

jobs:
  deliver:
    name: Build, transfer, and safely activate
    if: >-
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      vars.PRODUCTION_DELIVERY_MODE == 'docker-full' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360

    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Derive immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$SOURCE_SHA" ]]
          release_id="git-${SOURCE_SHA:0:12}"
          repository_owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          [[ "$repository_owner_lower" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          echo "DELIVERY_IMAGE=ghcr.io/$repository_owner_lower/memory-lighthouse-delivery" >> "$GITHUB_ENV"

      - name: Configure pinned SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.TX4H4G_SSH_PRIVATE_KEY_BASE64 }}
          SSH_KNOWN_HOSTS_BASE64: ${{ secrets.TX4H4G_KNOWN_HOSTS_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY_BASE64" && -n "$SSH_KNOWN_HOSTS_BASE64" ]]
          install -d -m 0700 "$HOME/.ssh"
          printf '%s' "$SSH_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.ssh/openbmb_deploy"
          printf '%s' "$SSH_KNOWN_HOSTS_BASE64" | base64 --decode > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/openbmb_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/openbmb_deploy" >/dev/null
          cat > "$HOME/.ssh/config" <<EOF
          Host tx4h4g-prod tx4h4g-prod-lane-*
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/openbmb_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 1
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            ControlMaster no
            ControlPath ~/.ssh/openbmb-%n-%C
            ControlPersist 130m
            ProxyCommand /bin/false
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF
          chmod 0600 "$HOME/.ssh/config"
          bash infra/production/scripts/ensure-ssh-master.sh tx4h4g-prod 6 5

      - name: Verify deployment host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          bash infra/production/scripts/ensure-ssh-master.sh tx4h4g-prod 6 5
          ssh tx4h4g-prod 'set -euo pipefail
             sudo -n true
             docker version >/dev/null
             docker compose version >/dev/null
             docker info --format "{{json .DriverStatus}}" | grep -Fq "io.containerd.snapshotter.v1"
             sudo -n test -d /opt/openbmb
             sudo -n test ! -L /opt/openbmb
             test "$(sudo -n stat -c %U:%G /opt/openbmb)" = root:openbmb
             test -z "$(sudo -n find /opt/openbmb -maxdepth 0 -perm /0022 -print -quit)"
             sudo -n test -d /opt/openbmb/releases
             sudo -n test ! -L /opt/openbmb/releases
             test "$(sudo -n stat -c %U:%G /opt/openbmb/releases)" = root:openbmb
             test -z "$(sudo -n find /opt/openbmb/releases -maxdepth 0 -perm /0022 -print -quit)"
             docker_root="$(docker info --format "{{.DockerRootDir}}")"
             docker_free_kib="$(sudo -n df -Pk "$docker_root" | awk "NR == 2 { print \$4 }")"
             release_free_kib="$(sudo -n df -Pk /opt/openbmb/releases | awk "NR == 2 { print \$4 }")"
            test "${docker_free_kib:-0}" -ge 4194304
            test "${release_free_kib:-0}" -ge 1048576'

      - name: Reuse only a fully verified immutable release
        shell: bash
        run: |
          set -euo pipefail
          bash infra/production/scripts/ensure-ssh-master.sh tx4h4g-prod 6 5
          already_staged="$(ssh tx4h4g-prod \
            "set -euo pipefail
             release_root='/opt/openbmb/releases/$RELEASE_ID'
             if sudo test -e \"\$release_root\" || sudo test -L \"\$release_root\"; then
               sudo test ! -L \"\$release_root\"
               test \"\$(sudo cat \"\$release_root/.openbmb-release-sha\")\" = '$SOURCE_SHA'
               sudo OPENBMB_INFRA_ENV_FILE=/etc/openbmb/infra.env \\
                 OPENBMB_API_ENV_FILE=/etc/openbmb/api.env \\
                 bash \"\$release_root/infra/production/scripts/verify-release-images.sh\" >/dev/null
               printf true
             else
               printf false
             fi")"
          [[ "$already_staged" == true || "$already_staged" == false ]]
          echo "ALREADY_STAGED=$already_staged" >> "$GITHUB_ENV"

      - name: Use stable OCI image identities on the runner
        if: env.ALREADY_STAGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          daemon_config=/etc/docker/daemon.json
          current_config='{}'
          if sudo test -f "$daemon_config"; then
            current_config="$(sudo cat "$daemon_config")"
          fi
          updated_config="$(
            jq -ce '
              if type != "object" then
                error("Docker daemon configuration must be a JSON object")
              elif (.features != null and (.features | type) != "object") then
                error("Docker daemon features configuration must be a JSON object")
              else
                .features = ((.features // {}) + {"containerd-snapshotter": true})
              end
            ' <<<"$current_config"
          )"
          config_tmp="$(mktemp "$RUNNER_TEMP/openbmb-docker-daemon.XXXXXX.json")"
          cleanup() {
            rm -f -- "$config_tmp"
          }
          trap cleanup EXIT
          printf '%s\n' "$updated_config" > "$config_tmp"
          sudo install -o root -g root -m 0644 "$config_tmp" "$daemon_config"
          sudo systemctl restart docker

          driver_status=''
          for attempt in {1..12}; do
            driver_status="$(docker info --format '{{json .DriverStatus}}' 2>/dev/null || true)"
            if jq -e \
              'any(.[]; . == ["driver-type", "io.containerd.snapshotter.v1"])' \
              <<<"$driver_status" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          jq -e 'any(.[]; . == ["driver-type", "io.containerd.snapshotter.v1"])' \
            <<<"$driver_status" >/dev/null
          trap - EXIT
          cleanup

      - name: Build immutable application images
        if: env.ALREADY_STAGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --target api-runtime \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --file infra/production/Dockerfile.api \
            --tag "openbmb-api:$RELEASE_ID" .
          docker build \
            --target api-migrator \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --file infra/production/Dockerfile.api \
            --tag "openbmb-migrator:$RELEASE_ID" .
          docker build --pull \
            --target client-runtime \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg VITE_API_BASE_URL=/openBMB/api/v1 \
            --file infra/production/Dockerfile.web \
            --tag "openbmb-client-web:$RELEASE_ID" .
          docker build \
            --target admin-runtime \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg VITE_API_BASE=/openBMB/api/v1 \
            --file infra/production/Dockerfile.web \
            --tag "openbmb-admin-web:$RELEASE_ID" .

      - name: Pull pinned infrastructure images
        if: env.ALREADY_STAGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source infra/production/scripts/release-image-set.sh
          openbmb_load_release_image_set "$RELEASE_ID"
          for index in "${!OPENBMB_REQUIRED_IMAGES[@]}"; do
            source_image="${OPENBMB_SOURCE_IMAGES[$index]}"
            release_image="${OPENBMB_REQUIRED_IMAGES[$index]}"
            if [[ "$source_image" != "$release_image" ]]; then
              docker pull "$source_image"
              docker tag "$source_image" "$release_image"
             fi
           done

      - name: Verify stable OCI image identities
        if: env.ALREADY_STAGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source infra/production/scripts/release-image-set.sh
          openbmb_load_release_image_set "$RELEASE_ID"
          for image_name in "${OPENBMB_REQUIRED_IMAGES[@]}"; do
            image_id="$(docker image inspect --format '{{.Id}}' "$image_name")"
            descriptor_digest="$(
              docker image inspect --format '{{.Descriptor.digest}}' "$image_name"
            )"
            [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$descriptor_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            if [[ "$image_id" != "$descriptor_digest" ]]; then
              printf 'unstable cross-host image identity for %s\n' "$image_name" >&2
              exit 1
            fi
          done

      - name: Publish exact release transport images to GHCR
        if: env.ALREADY_STAGED != 'true'
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_dir="$RUNNER_TEMP/openbmb-ghcr-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          transport_manifest_name="openbmb-transport-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          transport_manifest="$RUNNER_TEMP/$transport_manifest_name"
          case "$auth_dir" in
            "$RUNNER_TEMP"/openbmb-ghcr-auth-[0-9]*-[0-9]*) ;;
            *) printf 'unsafe runner authentication path\n' >&2; exit 1 ;;
          esac
          [[ ! -e "$transport_manifest" && ! -L "$transport_manifest" ]]
          install -m 0600 /dev/null "$transport_manifest"
          install -d -m 0700 "$auth_dir"
          cleanup() {
            DOCKER_CONFIG="$auth_dir" docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "$auth_dir"
          }
          trap cleanup EXIT
          printf '%s\n' "$GHCR_TOKEN" | DOCKER_CONFIG="$auth_dir" \
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          source infra/production/scripts/release-image-set.sh
          openbmb_load_release_image_set "$RELEASE_ID"
          images=("${OPENBMB_REQUIRED_IMAGES[@]}")
          components=("${OPENBMB_DELIVERY_COMPONENTS[@]}")
          for index in "${!images[@]}"; do
            delivery_ref="$DELIVERY_IMAGE:${components[$index]}-$RELEASE_ID"
            docker tag "${images[$index]}" "$delivery_ref"
            push_log="$auth_dir/push-${components[$index]}.log"
            DOCKER_CONFIG="$auth_dir" docker push "$delivery_ref" 2>&1 | tee "$push_log"
            mapfile -t pushed_digests < <(
              sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}) size: [0-9]+.*$/\1/p' \
                "$push_log" | sort -u
            )
            [[ "${#pushed_digests[@]}" -eq 1 ]]
            pushed_digest="${pushed_digests[0]}"
            registry_digest=''
            for attempt in {1..6}; do
              candidate_digest="$(
                DOCKER_CONFIG="$auth_dir" docker buildx imagetools inspect \
                  "$delivery_ref" --format '{{json .Manifest}}' 2>/dev/null |
                  jq -er '.digest | strings | select(test("^sha256:[0-9a-f]{64}$"))' \
                    2>/dev/null || true
              )"
              if [[ "$candidate_digest" == "$pushed_digest" ]]; then
                registry_digest="$candidate_digest"
                break
              fi
              if (( attempt < 6 )); then
                printf 'GHCR digest has not converged for %s (attempt %s/6); retrying.\n' \
                  "$delivery_ref" "$attempt" >&2
                sleep "$((attempt * 3))"
              fi
            done
            [[ "$registry_digest" == "$pushed_digest" ]]
            printf '%s %s %s\n' \
              "${images[$index]}" "$delivery_ref" "$pushed_digest" \
              >> "$transport_manifest"
          done
          [[ "$(wc -l < "$transport_manifest")" -eq "${#images[@]}" ]]
          awk 'NF != 3 { exit 1 }' "$transport_manifest"
          trap - EXIT
          cleanup

      - name: Transfer exact release images over resumable SSH
        if: env.ALREADY_STAGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash infra/production/scripts/ensure-ssh-master.sh tx4h4g-prod 6 5
          for lane in {1..8}; do
            bash infra/production/scripts/ensure-ssh-master.sh \
              "tx4h4g-prod-lane-$lane" 6 5
          done
          manifest_name="openbmb-images-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          host_image_manifest="$RUNNER_TEMP/$manifest_name"
          source infra/production/scripts/release-image-set.sh
          openbmb_load_release_image_set "$RELEASE_ID"
          required_images=("${OPENBMB_REQUIRED_IMAGES[@]}")
          OPENBMB_TRANSFER_SSH_LANES=8 \
            OPENBMB_TRANSFER_CHUNK_BYTES=8388608 \
            bash infra/production/scripts/transfer-release-images.sh \
            "$RELEASE_ID" "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            tx4h4g-prod "$host_image_manifest"
          [[ "$(wc -l < "$host_image_manifest")" -eq "${#required_images[@]}" ]]
          while read -r image_name image_id trailing; do
            [[ -n "$image_name" && "$image_id" =~ ^sha256:[0-9a-f]{64}$ && -z "${trailing:-}" ]]
          done < "$host_image_manifest"
          for required_image in "${required_images[@]}"; do
            [[ "$(awk -v image="$required_image" '$1 == image { count += 1 } END { print count + 0 }' "$host_image_manifest")" -eq 1 ]]
          done
          ssh tx4h4g-prod \
            "test ! -e \"\$HOME/.openbmb-transfer/direct-v2/sessions/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\" && test ! -L \"\$HOME/.openbmb-transfer/direct-v2/sessions/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\""

      - name: Stage exact source release
        if: env.ALREADY_STAGED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash infra/production/scripts/ensure-ssh-master.sh tx4h4g-prod 6 5
          archive_name="openbmb-source-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          manifest_name="openbmb-images-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          transport_manifest_name="openbmb-transport-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          source_archive="$RUNNER_TEMP/$archive_name"
          image_manifest="$RUNNER_TEMP/$manifest_name"
          transport_manifest="$RUNNER_TEMP/$transport_manifest_name"
          source infra/production/scripts/release-image-set.sh
          openbmb_load_release_image_set "$RELEASE_ID"
          expected_image_count="${#OPENBMB_REQUIRED_IMAGES[@]}"
          git archive --format=tar.gz --output="$source_archive" "$SOURCE_SHA"
          [[ -f "$image_manifest" && ! -L "$image_manifest" ]]
          [[ -f "$transport_manifest" && ! -L "$transport_manifest" ]]
          source_archive_sha256="$(sha256sum "$source_archive" | awk '{ print $1 }')"
          image_manifest_sha256="$(sha256sum "$image_manifest" | awk '{ print $1 }')"
          transport_manifest_sha256="$(sha256sum "$transport_manifest" | awk '{ print $1 }')"
          [[ "$source_archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$image_manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$transport_manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          transfer_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote_transfer_dir=".openbmb-transfer/$transfer_id"
          cleanup_stage_transfer() {
            ssh tx4h4g-prod \
              "rm -f -- \"\$HOME/$remote_transfer_dir/$archive_name\" \"\$HOME/$remote_transfer_dir/$manifest_name\" \"\$HOME/$remote_transfer_dir/$transport_manifest_name\"; rmdir -- \"\$HOME/$remote_transfer_dir\" 2>/dev/null || true" \
              >/dev/null 2>&1 || true
          }
          trap cleanup_stage_transfer EXIT
          ssh tx4h4g-prod \
            "set -eu; install -d -m 0700 \"\$HOME/.openbmb-transfer\" \"\$HOME/$remote_transfer_dir\""
          scp "$source_archive" "$image_manifest" "$transport_manifest" \
            "tx4h4g-prod:$remote_transfer_dir/"
          ssh tx4h4g-prod \
            "SOURCE_SHA='$SOURCE_SHA' RELEASE_ID='$RELEASE_ID' GITHUB_RUN_ID='$GITHUB_RUN_ID' GITHUB_RUN_ATTEMPT='$GITHUB_RUN_ATTEMPT' TRANSFER_ID='$transfer_id' ARCHIVE_NAME='$archive_name' MANIFEST_NAME='$manifest_name' TRANSPORT_MANIFEST_NAME='$transport_manifest_name' SOURCE_ARCHIVE_SHA256='$source_archive_sha256' IMAGE_MANIFEST_SHA256='$image_manifest_sha256' TRANSPORT_MANIFEST_SHA256='$transport_manifest_sha256' EXPECTED_IMAGE_COUNT='$expected_image_count' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_ID" == "git-${SOURCE_SHA:0:12}" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$TRANSFER_ID" == "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]
          [[ "$ARCHIVE_NAME" == "openbmb-source-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz" ]]
          [[ "$MANIFEST_NAME" == "openbmb-images-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt" ]]
          [[ "$TRANSPORT_MANIFEST_NAME" == "openbmb-transport-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt" ]]
          [[ "$SOURCE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$IMAGE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TRANSPORT_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_IMAGE_COUNT" =~ ^[1-9][0-9]*$ ]]
          release_root="/opt/openbmb/releases/$RELEASE_ID"
          transfer_dir="$HOME/.openbmb-transfer/$TRANSFER_ID"
          source_archive="$transfer_dir/$ARCHIVE_NAME"
          image_manifest="$transfer_dir/$MANIFEST_NAME"
          transport_manifest="$transfer_dir/$TRANSPORT_MANIFEST_NAME"
          incoming="/opt/openbmb/releases/.incoming-$RELEASE_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          candidate="$incoming/$RELEASE_ID"
          case "$incoming" in
            /opt/openbmb/releases/.incoming-git-[0-9a-f]*-[0-9]*-[0-9]*) ;;
            *) printf 'unsafe incoming release path\n' >&2; exit 1 ;;
          esac
          cleanup() {
            sudo rm -rf -- "$incoming"
            rm -f -- "$source_archive" "$image_manifest" "$transport_manifest"
            rmdir -- "$transfer_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          printf '%s  %s\n' "$SOURCE_ARCHIVE_SHA256" "$source_archive" | sha256sum --check --status
          printf '%s  %s\n' "$IMAGE_MANIFEST_SHA256" "$image_manifest" | sha256sum --check --status
          printf '%s  %s\n' "$TRANSPORT_MANIFEST_SHA256" "$transport_manifest" | sha256sum --check --status
          [[ "$(wc -l < "$image_manifest")" -eq "$EXPECTED_IMAGE_COUNT" ]]
          [[ "$(wc -l < "$transport_manifest")" -eq "$EXPECTED_IMAGE_COUNT" ]]
          sudo chown root:openbmb /opt/openbmb/releases
          sudo chmod 0750 /opt/openbmb/releases
          if sudo -n test -e "$release_root" || sudo -n test -L "$release_root"; then
            sudo -n test ! -L "$release_root"
            [[ "$(sudo readlink -f -- "$release_root")" == "$release_root" ]]
            [[ "$(sudo cat "$release_root/.openbmb-release-sha")" == "$SOURCE_SHA" ]]
            [[ "$(sudo cat "$release_root/.openbmb-source-sha256")" == "$SOURCE_ARCHIVE_SHA256" ]]
            [[ "$(sudo stat -c %U "$release_root")" == root ]]
            ! sudo find "$release_root" -xdev \( ! -user root -o -perm /022 \) -print -quit | grep -q .
            sudo cmp --silent "$image_manifest" "$release_root/.openbmb-images"
            sudo cmp --silent "$transport_manifest" "$release_root/.openbmb-transport-digests"
          else
            if sudo -n test -e "$incoming" || sudo -n test -L "$incoming"; then
              sudo rm -rf -- "$incoming"
            fi
            sudo -n test ! -e "$incoming"
            sudo -n test ! -L "$incoming"
            sudo install -d -o root -g openbmb -m 0550 "$incoming"
            sudo install -d -o root -g openbmb -m 0550 "$candidate"
            sudo tar --no-same-owner --no-same-permissions -xzf "$source_archive" -C "$candidate"
            printf '%s\n' "$SOURCE_SHA" | sudo tee "$candidate/.openbmb-release-sha" >/dev/null
            printf '%s\n' "$SOURCE_ARCHIVE_SHA256" | sudo tee "$candidate/.openbmb-source-sha256" >/dev/null
            sudo install -o root -g openbmb -m 0440 \
              "$image_manifest" "$candidate/.openbmb-images"
            sudo install -o root -g openbmb -m 0440 \
              "$transport_manifest" "$candidate/.openbmb-transport-digests"
            sudo chown -R root:openbmb "$incoming"
            sudo find "$incoming" -xdev -type d -exec chmod 0550 {} +
            sudo find "$incoming" -xdev -type f -perm /111 -exec chmod 0550 {} +
            sudo find "$incoming" -xdev -type f ! -perm /111 -exec chmod 0440 {} +
            sudo chmod 0444 \
              "$candidate/infra/redis/redis.conf" \
              "$candidate/infra/production/livekit/livekit.production.yaml"
            sudo chmod 0555 "$candidate/infra/redis/start-livekit-redis.sh"
            sudo OPENBMB_INFRA_ENV_FILE=/etc/openbmb/infra.env \
              OPENBMB_API_ENV_FILE=/etc/openbmb/api.env \
              bash "$candidate/infra/production/scripts/verify-release-images.sh"
            sudo mv "$candidate" "$release_root"
          fi
          trap - EXIT
          cleanup
          REMOTE
          trap - EXIT
          cleanup_stage_transfer
          ssh tx4h4g-prod \
            "test ! -e \"\$HOME/$remote_transfer_dir\" && test ! -L \"\$HOME/$remote_transfer_dir\""

      - name: Verify transferred release assets
        shell: bash
        run: |
          set -euo pipefail
          bash infra/production/scripts/ensure-ssh-master.sh tx4h4g-prod 6 5
          ssh tx4h4g-prod \
            "set -euo pipefail; test \"\$(sudo cat /opt/openbmb/releases/$RELEASE_ID/.openbmb-release-sha)\" = '$SOURCE_SHA'; sudo OPENBMB_INFRA_ENV_FILE=/etc/openbmb/infra.env OPENBMB_API_ENV_FILE=/etc/openbmb/api.env bash /opt/openbmb/releases/$RELEASE_ID/infra/production/scripts/verify-release-images.sh"

      - name: Reject stale manual activation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$current_main_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$current_main_sha" != "$SOURCE_SHA" ]]; then
            printf 'Refusing stale activation: validated=%s current-main=%s\n' \
              "$SOURCE_SHA" "$current_main_sha" >&2
            exit 1
          fi

      - name: Activate validated release
        shell: bash
        run: |
          set -euo pipefail
          bash infra/production/scripts/ensure-ssh-master.sh tx4h4g-prod 6 5
          ssh tx4h4g-prod bash -s -- "$RELEASE_ID" <<'REMOTE'
          set -euo pipefail
          release_id="$1"
          [[ "$release_id" =~ ^git-[0-9a-f]{12}$ ]]
          runtime_mode=/usr/local/sbin/openbmb-runtime-mode
          runtime_state=/var/lib/openbmb/hybrid-runtime
          if sudo -n test -e "$runtime_mode" || sudo -n test -L "$runtime_mode" || \
             sudo -n test -e "$runtime_state" || sudo -n test -L "$runtime_state"; then
            sudo -n test -f "$runtime_mode"
            sudo -n test ! -L "$runtime_mode"
            sudo -n test -x "$runtime_mode"
            runtime_status="$(sudo -n "$runtime_mode" status)"
            runtime_value="$(sed -n 's/^mode=//p' <<<"$runtime_status")"
            runtime_pending="$(sed -n 's/^pending=//p' <<<"$runtime_status")"
            [[ "$runtime_pending" == no ]] || {
              printf 'Refusing Docker activation while a runtime transition is pending.\n' >&2
              exit 1
            }
            case "$runtime_value" in
              hybrid) sudo -n "$runtime_mode" switch docker ;;
              docker) ;;
              *)
                printf 'Refusing Docker activation from unknown runtime mode: %s\n' \
                  "$runtime_value" >&2
                exit 1
                ;;
            esac
          fi
          sudo -n env \
            OPENBMB_INFRA_ENV_FILE=/etc/openbmb/infra.env \
            OPENBMB_API_ENV_FILE=/etc/openbmb/api.env \
            OPENBMB_SKIP_IMAGE_BUILD=true \
            "/opt/openbmb/releases/$release_id/infra/production/scripts/deploy-release.sh"
          if sudo -n test -e "$runtime_mode" || sudo -n test -L "$runtime_mode" || \
             sudo -n test -e "$runtime_state" || sudo -n test -L "$runtime_state"; then
            # deploy-release has exited, so the production operation lock is
            # no longer held. Recover boot jobs that may have failed while a
            # durable security-boundary transaction was awaiting this resume.
            sudo -n systemctl reset-failed openbmb.service openbmb-hybrid-recovery.service caddy.service
            sudo -n systemctl restart openbmb.service
            sudo -n systemctl restart openbmb-hybrid-recovery.service
            sudo -n systemctl restart caddy.service
            sudo -n systemctl is-active --quiet openbmb.service
            sudo -n systemctl is-active --quiet openbmb-hybrid-recovery.service
            sudo -n systemctl is-active --quiet caddy.service
            recovered_status="$(sudo -n "$runtime_mode" status)"
            [[ "$recovered_status" == $'mode=docker\nupstream=127.0.0.1:13100\npending=no' ]]
          fi
          REMOTE

      - name: Verify public health after activation
        shell: bash
        run: |
          set -euo pipefail
          bash infra/production/scripts/ensure-ssh-master.sh tx4h4g-prod 6 5
          ssh tx4h4g-prod \
            "sudo -n env OPENBMB_DOMAIN=sun227454.online bash /opt/openbmb/releases/$RELEASE_ID/infra/production/scripts/health-check.sh --public"
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://sun227454.online/openBMB/api/v1/health/ready \
            --output /dev/null

      - name: Close pinned SSH master
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for lane in {1..8}; do
            ssh -O exit "tx4h4g-prod-lane-$lane" >/dev/null 2>&1 || true
          done
          ssh -O exit tx4h4g-prod >/dev/null 2>&1 || true
