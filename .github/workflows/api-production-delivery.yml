name: API production delivery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: production-openbmb-api
  cancel-in-progress: false

env:
  CI: "true"
  NODE_VERSION: "22.19.0"
  DEPLOY_HOST: 124.220.81.104
  DEPLOY_USER: ubuntu
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  REMOTE_INCOMING_ROOT: /home/ubuntu/.openbmb-api-incoming

jobs:
  plan-api:
    name: Plan API production reconciliation
    if: >-
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      production_sha: ${{ steps.plan.outputs.production_sha }}
      should_release: ${{ steps.plan.outputs.should_release }}

    steps:
      - name: Check out the exact CI-validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan API delivery from the last verified promotion
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            marker_error="$RUNNER_TEMP/api-production-marker.err"
            set +e
            production_sha="$(
              bash scripts/hybrid/production-deployment-marker.sh read api \
                2>"$marker_error"
            )"
            marker_status=$?
            set -e
            if [[ "$marker_status" -ne 0 || ! "$production_sha" =~ ^[0-9a-f]{40}$ ]]; then
              cat "$marker_error" >&2 || true
              echo "::warning::No trustworthy API promotion marker is available; fail-open delivery is required."
              production_sha=''
            fi
            should_release="$(
              bash scripts/hybrid/detect-release-changes.sh api "$SOURCE_SHA" \
                "${{ github.event.workflow_run.id }}" "$production_sha"
            )"
          else
            production_sha='manual-force'
            should_release=true
          fi
          {
            echo "production_sha=$production_sha"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"

      - name: Record API delivery plan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.plan.outputs.should_release }}" == false ]]; then
            echo '### API production delivery: SKIPPED' >> "$GITHUB_STEP_SUMMARY"
            echo "The last verified API promotion already contains every relevant change through $SOURCE_SHA." \
              >> "$GITHUB_STEP_SUMMARY"
            echo 'The protected production environment was not opened.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### API production delivery: RECONCILIATION REQUIRED' >> "$GITHUB_STEP_SUMMARY"
            echo "Production will be verified against source $SOURCE_SHA before packaging." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  deliver-api:
    name: Reconcile native API production
    needs: plan-api
    if: needs.plan-api.outputs.should_release == 'true'
    permissions:
      actions: read
      contents: read
      deployments: write
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45

    steps:
      - name: Check out the exact CI-validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure pinned SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.TX4H4G_SSH_PRIVATE_KEY_BASE64 }}
          SSH_KNOWN_HOSTS_BASE64: ${{ secrets.TX4H4G_KNOWN_HOSTS_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_PRIVATE_KEY_BASE64" && -n "$SSH_KNOWN_HOSTS_BASE64" ]]
          install -d -m 0700 "$HOME/.ssh"
          printf '%s' "$SSH_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.ssh/openbmb_api_deploy"
          printf '%s' "$SSH_KNOWN_HOSTS_BASE64" | base64 --decode > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/openbmb_api_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/openbmb_api_deploy" >/dev/null
          cat > "$HOME/.ssh/config" <<EOF
          Host tx4h4g-api-prod
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/openbmb_api_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 2
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            ControlMaster auto
            ControlPath ~/.ssh/openbmb-api-%C
            ControlPersist 10m
            ProxyCommand none
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 0600 "$HOME/.ssh/config"
          ssh tx4h4g-api-prod 'true'

      - name: Verify locked production API baseline
        id: reconcile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            baseline_error="$RUNNER_TEMP/api-production-baseline.err"
            set +e
            production_sha="$(
              ssh tx4h4g-api-prod sudo -n bash -s -- baseline api \
                < scripts/hybrid/remote-promotion-guard.sh 2>"$baseline_error"
            )"
            baseline_status=$?
            set -e
            if [[ "$baseline_status" -ne 0 || ! "$production_sha" =~ ^[0-9a-f]{40}$ ]]; then
              cat "$baseline_error" >&2 || true
              echo "::warning::Could not verify the promoted API SHA; fail-open reconciliation is required."
              production_sha=''
              should_release=true
            else
              should_release="$(bash scripts/hybrid/detect-release-changes.sh api "$SOURCE_SHA" "${{ github.event.workflow_run.id }}" "$production_sha")"
            fi
          else
            production_sha='manual-force'
            should_release=true
          fi
          {
            echo "production_sha=$production_sha"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"

      - name: Skip API delivery when the locked server is current
        if: steps.reconcile.outputs.should_release == 'false'
        run: |
          echo "No API-relevant file changes detected for ${SOURCE_SHA}; skip delivery."

      - name: Validate immutable source identity
        if: steps.reconcile.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Set up the pinned native runtime version
        if: steps.reconcile.outputs.should_release == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          cache: npm

      - name: Pin the package manager and runner architecture
        if: steps.reconcile.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 ]]
          npm install --global npm@11.4.2
          [[ "$(npm --version)" == 11.4.2 ]]

      - name: Install the locked server dependency graph
        if: steps.reconcile.outputs.should_release == 'true'
        run: >-
          npm ci
          --workspace @memory-lighthouse/server-api
          --include-workspace-root

      - name: Build the NestJS server
        if: steps.reconcile.outputs.should_release == 'true'
        run: npm run build --workspace @memory-lighthouse/server-api

      - name: Prune development-only dependencies
        if: steps.reconcile.outputs.should_release == 'true'
        run: >-
          npm prune --omit=dev
          --package-lock=false
          --workspace @memory-lighthouse/server-api
          --include-workspace-root

      - name: Verify the complete production dependency closure
        if: steps.reconcile.outputs.should_release == 'true'
        run: >-
          npm ls --omit=dev --all
          --workspace @memory-lighthouse/server-api
          --include-workspace-root

      - name: Verify build and pruning preserved immutable source
        if: steps.reconcile.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dirty_status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$dirty_status" ]]; then
            echo '::error::The API build or dependency pruning mutated the validated checkout.'
            printf '%s\n' "$dirty_status" >&2
            git diff --stat -- . >&2
            exit 65
          fi

      - name: Package and verify the native API artifact
        id: package
        if: steps.reconcile.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/openbmb-api-artifact"
          install -d -m 0700 "$artifact_dir"
          release_id="git-${SOURCE_SHA:0:12}"
          archive_name="openbmb-native-api-$release_id.tar.gz"
          archive="$artifact_dir/$archive_name"
          sidecar="$archive.sha256"
          bash scripts/hybrid/package-api.sh "$SOURCE_SHA" "$archive" \
            | tee "$artifact_dir/package.log"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          grep -Fxq "$archive_sha256  $archive_name" "$sidecar"
          mapfile -t expanded_values < <(sed -n 's/^API_EXPANDED_BYTES=//p' "$artifact_dir/package.log")
          [[ "${#expanded_values[@]}" -eq 1 && "${expanded_values[0]}" =~ ^[1-9][0-9]*$ ]]
          expanded_bytes="${expanded_values[0]}"
          archive_bytes="$(stat -c %s -- "$archive")"
          [[ "$archive_bytes" =~ ^[1-9][0-9]*$ ]]
          promotion_required_bytes=$((expanded_bytes + archive_bytes + 1073741824))
          upload_required_bytes=$((promotion_required_bytes + archive_bytes))
          remote_directory="$REMOTE_INCOMING_ROOT/$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "archive=$archive"
            echo "sidecar=$sidecar"
            echo "archive_name=$archive_name"
            echo "archive_sha256=$archive_sha256"
            echo "release_id=$release_id"
            echo "remote_directory=$remote_directory"
            echo "promotion_required_bytes=$promotion_required_bytes"
            echo "upload_required_bytes=$upload_required_bytes"
          } >> "$GITHUB_OUTPUT"

      - name: Retain exact API artifact evidence
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-api-release-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/openbmb-api-artifact/
          if-no-files-found: error
          retention-days: 3

      - name: Upload and atomically promote the exact API artifact
        id: promote
        if: steps.reconcile.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          SIDECAR: ${{ steps.package.outputs.sidecar }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
          REMOTE_DIRECTORY: ${{ steps.package.outputs.remote_directory }}
          PROMOTION_REQUIRED_BYTES: ${{ steps.package.outputs.promotion_required_bytes }}
          UPLOAD_REQUIRED_BYTES: ${{ steps.package.outputs.upload_required_bytes }}
        run: |
          set -euo pipefail
          [[ -f "$ARCHIVE" && ! -L "$ARCHIVE" ]]
          [[ -f "$SIDECAR" && ! -L "$SIDECAR" ]]
          [[ "$ARCHIVE_NAME" == "openbmb-native-api-git-${SOURCE_SHA:0:12}.tar.gz" ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_ID" == "git-${SOURCE_SHA:0:12}" ]]
          [[ "$PROMOTION_REQUIRED_BYTES" =~ ^[1-9][0-9]*$ ]]
          [[ "$UPLOAD_REQUIRED_BYTES" =~ ^[1-9][0-9]*$ ]]
          [[ "$REMOTE_DIRECTORY" =~ ^/home/ubuntu/\.openbmb-api-incoming/[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$(sha256sum "$ARCHIVE" | awk '{print $1}')" == "$ARCHIVE_SHA256" ]]
          grep -Fxq "$ARCHIVE_SHA256  $ARCHIVE_NAME" "$SIDECAR"

          cleanup_remote_directory() {
            ssh tx4h4g-api-prod bash -s -- \
              "$REMOTE_INCOMING_ROOT" "$REMOTE_DIRECTORY" "$ARCHIVE_NAME" <<'REMOTE' \
              >/dev/null 2>&1 || true
          set -euo pipefail
          incoming_root="$1"
          remote_directory="$2"
          archive_name="$3"
          [[ "$(dirname -- "$remote_directory")" == "$incoming_root" ]]
          for path in \
            "$remote_directory/$archive_name" \
            "$remote_directory/$archive_name.sha256"; do
            if [[ -e "$path" || -L "$path" ]]; then
              [[ -f "$path" && ! -L "$path" ]]
              rm -f -- "$path"
            fi
          done
          if [[ -e "$remote_directory" || -L "$remote_directory" ]]; then
            [[ -d "$remote_directory" && ! -L "$remote_directory" ]]
            rmdir -- "$remote_directory"
          fi
          REMOTE
          }
          trap cleanup_remote_directory EXIT

          ssh tx4h4g-api-prod bash -s -- \
            api "$REMOTE_INCOMING_ROOT" "$REMOTE_DIRECTORY" "$UPLOAD_REQUIRED_BYTES" \
            < scripts/hybrid/prepare-remote-incoming.sh
          ssh tx4h4g-api-prod sudo -n bash -s -- \
            upload-preflight api "$UPLOAD_REQUIRED_BYTES" \
            < scripts/hybrid/remote-promotion-guard.sh

          scp -- "$ARCHIVE" "$SIDECAR" "tx4h4g-api-prod:$REMOTE_DIRECTORY/"

          bash scripts/hybrid/assert-current-main.sh "$SOURCE_SHA"
          ssh tx4h4g-api-prod sudo -n bash -s -- \
            api "$SOURCE_SHA" "$REMOTE_DIRECTORY/$ARCHIVE_NAME" \
            "$REMOTE_DIRECTORY/$ARCHIVE_NAME.sha256" "$ARCHIVE_SHA256" \
            "$RELEASE_ID" "$PROMOTION_REQUIRED_BYTES" \
            < scripts/hybrid/remote-promotion-guard.sh

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$HOME/.ssh" && ! -L "$HOME/.ssh" ]]; then
            if [[ -f "$HOME/.ssh/config" && ! -L "$HOME/.ssh/config" ]]; then
              ssh -O exit tx4h4g-api-prod >/dev/null 2>&1 || true
            fi
            rm -f -- \
              "$HOME/.ssh/openbmb_api_deploy" \
              "$HOME/.ssh/known_hosts" \
              "$HOME/.ssh/config"
          fi

      - name: Record API delivery result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.reconcile.outputs.should_release }}" == false ]]; then
            echo '### API production delivery: SKIPPED' >> "$GITHUB_STEP_SUMMARY"
            echo "The locked server already contains every API-relevant change through $SOURCE_SHA." \
              >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.promote.outcome }}" == success ]]; then
            echo '### API production delivery: DEPLOYED' >> "$GITHUB_STEP_SUMMARY"
            echo "Promoted immutable API source $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### API production delivery: FAILED' >> "$GITHUB_STEP_SUMMARY"
            echo "API reconciliation for $SOURCE_SHA did not complete." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record verified API reconciliation marker
        id: marker
        if: steps.reconcile.outputs.should_release == 'false' || steps.promote.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.promote.outcome }}" == success ]]; then
            result=DEPLOYED
          else
            result=RECONCILED
          fi
          bash scripts/hybrid/production-deployment-marker.sh mark api \
            "$SOURCE_SHA" "$GITHUB_RUN_ID" "$result"
