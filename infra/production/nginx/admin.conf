server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  charset utf-8;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /openBMB/admin {
    return 308 /openBMB/admin/;
  }

  location = /openBMB/admin/index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location ^~ /openBMB/admin/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ^~ /openBMB/admin/ {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri $uri/ /openBMB/admin/index.html;
  }

  location / {
    return 404;
  }
}
