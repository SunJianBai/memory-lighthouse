port: 17880

redis:
  address: 127.0.0.1:16380
  username: livekit
  db: 1

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  allow_tcp_fallback: true
  packet_buffer_size_video: 300
  packet_buffer_size_audio: 120

room:
  # NestJS explicitly creates a max-two-participant room after onsite answer
  # and before token minting. Self-hosted participant removal does not revoke
  # refreshed tokens, so terminal rooms must never be auto-created again.
  auto_create: false
  # Do not leave an accepted-but-never-joined room open beyond its initial
  # 60-second admission window. This complements, not replaces, deleteRoom.
  empty_timeout: 60
  departure_timeout: 20
  max_participants: 2
  enable_remote_unmute: false

turn:
  enabled: true
  udp_port: 3478
  ttl_seconds: 300

webhook:
  # Must match LIVEKIT_API_KEY in infra.env. The secret remains in LIVEKIT_KEYS.
  api_key: openbmb_api
  urls:
    - http://127.0.0.1:13100/openBMB/api/v1/webhooks/livekit

logging:
  level: info
  pion_level: error
  json: true
  sample: true
