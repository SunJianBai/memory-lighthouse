services:
  # Every production dependency uses a release-scoped local tag. This keeps an
  # older release verifiable and rollback-safe even if an upstream tag drifts.
  mysql:
    image: openbmb-mysql:${OPENBMB_INFRASTRUCTURE_RELEASE:?OPENBMB_INFRASTRUCTURE_RELEASE must identify an immutable release}

  redis:
    image: openbmb-redis:${OPENBMB_INFRASTRUCTURE_RELEASE:?OPENBMB_INFRASTRUCTURE_RELEASE must identify an immutable release}

  minio:
    image: openbmb-minio:${OPENBMB_INFRASTRUCTURE_RELEASE:?OPENBMB_INFRASTRUCTURE_RELEASE must identify an immutable release}

  minio-init:
    image: openbmb-minio-mc:${OPENBMB_INFRASTRUCTURE_RELEASE:?OPENBMB_INFRASTRUCTURE_RELEASE must identify an immutable release}

  # Linux host networking is intentional for the API. Caddy reaches the API
  # from loopback, which preserves the application's one-hop trusted-proxy
  # invariant. HOST is forced to loopback, so port 13100 is never public.
  api:
    image: openbmb-api:${OPENBMB_APPLICATION_RELEASE:?OPENBMB_APPLICATION_RELEASE must identify an immutable release}
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.api
      target: api-runtime
    container_name: openbmb-api
    restart: unless-stopped
    init: true
    network_mode: host
    env_file:
      - path: ${OPENBMB_API_ENV_FILE:?set OPENBMB_API_ENV_FILE to /etc/openbmb/api.env}
        required: true
        format: raw
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "13100"
      CORS_ORIGINS: https://${OPENBMB_DOMAIN:-sun227454.online}
      PUBLIC_APP_URL: https://${OPENBMB_DOMAIN:-sun227454.online}/openBMB
      MAIL_DELIVERY_MODE: smtp
      DATABASE_URL: mysql://${MYSQL_USER:-openbmb}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@127.0.0.1:${MYSQL_HOST_PORT:-13306}/${MYSQL_DATABASE:-openbmb}
      REDIS_URL: redis://openbmb-api:${REDIS_APP_PASSWORD:?set REDIS_APP_PASSWORD}@127.0.0.1:${REDIS_HOST_PORT:-16379}/0
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: ${CLAMAV_HOST_PORT:-13310}
      # Path-style S3 URLs become /openbmb-assets/<key> on the already-existing
      # main domain; Caddy preserves that exact signed path for MinIO.
      OBJECT_STORAGE_ENDPOINT: https://${OPENBMB_DOMAIN:-sun227454.online}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:-openbmb-assets}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${MINIO_APP_ACCESS_KEY:-openbmb-api}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY}
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      LIVEKIT_URL: ws://127.0.0.1:${LIVEKIT_SIGNAL_HOST_PORT:-17880}
      # The LiveKit client appends /rtc/v1. Caddy routes that path on the
      # already-resolving main domain, so deployment does not depend on a
      # separate rtc.* DNS record.
      LIVEKIT_PUBLIC_URL: wss://${OPENBMB_DOMAIN:-sun227454.online}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-openbmb_api}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      RATE_LIMIT_TRUST_PROXY_HOPS: "1"
      ENABLE_DEVELOPMENT_CONTENT_INSPECTION: "false"
    extra_hosts:
      # Keep S3 signatures on the public hostname while avoiding public-IP
      # hairpin routing for API-side HEAD/DELETE requests.
      - "${OPENBMB_DOMAIN:-sun227454.online}:127.0.0.1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      livekit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:13100/openBMB/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    mem_limit: 448m
    cpus: 0.80
    pids_limit: 180
    security_opt:
      - no-new-privileges:true
    logging: &production-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # clamd's TCP protocol has neither authentication nor transport encryption.
  # Publish it on host loopback only: the host-network API can scan assets,
  # while no public or shared Docker network can reach the daemon. The _base
  # image downloads signatures once into the persistent database volume.
  clamav:
    image: openbmb-clamav:${OPENBMB_INFRASTRUCTURE_RELEASE:?OPENBMB_INFRASTRUCTURE_RELEASE must identify an immutable release}
    container_name: openbmb-clamav
    restart: unless-stopped
    init: true
    ports:
      - 127.0.0.1:${CLAMAV_HOST_PORT:-13310}:3310
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CLAMD_STARTUP_TIMEOUT: "1800"
      FRESHCLAM_CHECKS: "2"
      CLAMD_CONF_TCPAddr: 0.0.0.0
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 200M
      CLAMD_CONF_MaxScanTime: "120000"
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_ReadTimeout: "120"
      CLAMD_CONF_CommandReadTimeout: "30"
      # Loading a second signature engine during refresh is too expensive on
      # TX4H4G. Scans pause briefly while the single engine is replaced.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      # Database validation loads another engine. Disabling it is a deliberate
      # 4 GiB-host trade-off; clamd still validates by successfully loading the
      # downloaded signatures before serving scans.
      FRESHCLAM_CONF_TestDatabases: "no"
      # The asset worker is also pinned to concurrency 1 on this 4 GiB host.
      # Keep clamd single-threaded so a burst cannot multiply scan buffers.
      CLAMD_CONF_MaxThreads: "1"
      CLAMD_CONF_MaxConnectionQueueLength: "2"
    volumes:
      - clamav_database:/var/lib/clamav
    networks:
      - clamav_egress
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 20s
      timeout: 10s
      retries: 6
      # The first _base-image boot must download and load all signatures.
      start_period: 30m
    stop_grace_period: 90s
    mem_limit: 1536m
    memswap_limit: 2048m
    cpus: 1.00
    pids_limit: 160
    security_opt:
      - no-new-privileges:true
    logging: *production-logging

  migrate:
    image: openbmb-migrator:${OPENBMB_RELEASE:?OPENBMB_RELEASE must identify an immutable release}
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.api
      target: api-migrator
    profiles: [tools]
    init: true
    network_mode: host
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-openbmb}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@127.0.0.1:${MYSQL_HOST_PORT:-13306}/${MYSQL_DATABASE:-openbmb}
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    logging: *production-logging

  client-web:
    image: openbmb-client-web:${OPENBMB_APPLICATION_RELEASE:?OPENBMB_APPLICATION_RELEASE must identify an immutable release}
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.web
      target: client-runtime
      args:
        VITE_API_BASE_URL: /openBMB/api/v1
    container_name: openbmb-client-web
    restart: unless-stopped
    ports:
      - 127.0.0.1:${OPENBMB_CLIENT_HOST_PORT:-14173}:8080
    networks:
      - web
      - web_host_access
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=8m,mode=0755
    mem_limit: 48m
    cpus: 0.15
    pids_limit: 60
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *production-logging

  admin-web:
    image: openbmb-admin-web:${OPENBMB_APPLICATION_RELEASE:?OPENBMB_APPLICATION_RELEASE must identify an immutable release}
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.web
      target: admin-runtime
      args:
        VITE_API_BASE: /openBMB/api/v1
    container_name: openbmb-admin-web
    restart: unless-stopped
    ports:
      - 127.0.0.1:${OPENBMB_ADMIN_HOST_PORT:-14174}:8080
    networks:
      - web
      - web_host_access
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=8m,mode=0755
    mem_limit: 48m
    cpus: 0.15
    pids_limit: 60
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *production-logging

  # LiveKit host networking avoids Docker's UDP/NAT ambiguity on a single-node
  # WebRTC deployment. Signal/API stays on loopback; only rtc/turn ports bind
  # publicly according to livekit/livekit.production.yaml.
  livekit:
    image: openbmb-livekit:${OPENBMB_INFRASTRUCTURE_RELEASE:?OPENBMB_INFRASTRUCTURE_RELEASE must identify an immutable release}
    network_mode: host
    networks: !reset []
    ports: !reset []
    command:
      - --config
      - /etc/livekit/livekit.yaml
      - --bind
      - 127.0.0.1
      - --node-ip
      - ${LIVEKIT_NODE_IP:?set LIVEKIT_NODE_IP to 124.220.81.104}
    volumes: !override
      - ../production/livekit/livekit.production.yaml:/etc/livekit/livekit.yaml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:${LIVEKIT_SIGNAL_HOST_PORT:-17880}/
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Host-network LiveKit reaches only this dedicated Redis ACL endpoint.
  redis-livekit:
    image: openbmb-redis:${OPENBMB_INFRASTRUCTURE_RELEASE:?OPENBMB_INFRASTRUCTURE_RELEASE must identify an immutable release}
    ports:
      - 127.0.0.1:${REDIS_LIVEKIT_HOST_PORT:-16380}:6379
    networks:
      - private
      - host_access

networks:
  web:
    name: openbmb_web
    internal: true
  # An internal-only bridge has no host gateway, so Docker cannot materialize
  # the loopback port publications above. Keep application isolation on `web`
  # and give the two credential-free static sites a separate gateway network.
  web_host_access:
    name: openbmb_web_host_access
  # Only ClamAV joins this egress-capable network so FreshClam can update its
  # signatures without gaining lateral access to application data services.
  clamav_egress:
    name: openbmb_clamav_egress

volumes:
  clamav_database:
    name: openbmb_clamav_database
